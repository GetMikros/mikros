# The Elegance C library for Mikros, pinned as a prebuilt library
# (MIKSPEC-0062.R18): the package that the CI of the Elegance repository
# builds for x86_64-unknown-mikros, laid out as /system. The record below
# says where the archive came from; xtask checks the archive's SHA-256, the
# form of the commit and the contents of the archive, not the rest.
# The library loads the Vulkan loader at run time, which the system holds.

[prebuilt]
url = "https://github.com/EleganceUI/elegance/releases/download/c-a3647de3e568/elegance-c-x86_64-unknown-mikros.tar.gz"
sha256 = "5e7b818ea552f1b3edc405ca528f78b73d69b08eb10f45760b30233e033942e3"
repository = "https://github.com/EleganceUI/elegance"
commit = "a3647de3e5681442bf3a582bfd1b554a48cebfd1"
workflow = "https://github.com/EleganceUI/elegance/actions/runs/46081677611"
sysroot = "sysroot-32a3874874f4, commit 32a3874874f4dce2f8d7fef68dc1a332cf43e5da of this repository"
toolchain = "the toolchain archive of the release sysroot-32a3874874f4, commit 32a3874874f4dce2f8d7fef68dc1a332cf43e5da"

# The library, its licence and its build record are part of the desktop, not
# of the server edition.
[editions]
"libraries/eleganceui.0.dlib" = ["desktop"]
"share/doc/elegance/LICENSE-elegance" = ["desktop"]
"share/doc/elegance/BUILDINFO" = ["desktop"]
