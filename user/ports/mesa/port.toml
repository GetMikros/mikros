# Mesa, for lavapipe, the CPU Vulkan driver, as libvulkan_lvp.dlib with
# its driver manifest, and its Wayland surfaces. Nothing else of Mesa is
# built: no OpenGL, EGL or GBM. It is built against libLLVM.dlib of the
# llvm port, which Meson finds through LLVM's CMake package, without
# RTTI as LLVM is, and glslang compiles its shaders on the build host.
# The patches:
# - 0001: the build names Mikros's libraries lib<name>.dlib, defines
#   _GNU_SOURCE there, as Mikros's C library needs for the functions
#   that Mesa uses, and finds LLVM through its CMake package, since
#   Mikros has no llvm-config for it.
# - 0002: Mikros is a POSIX system for Mesa's checks of the operating
#   system, takes its memory size from sysconf, and the DRM header takes
#   ioctl numbers from <sys/ioctl.h>.
# - 0003: llvmpipe's generated code on Mikros goes into memory objects,
#   each mapped writable for LLVM to write it and executable, read-only,
#   to run it, and never both, with the executable addresses given to
#   MCJIT once an object is loaded; the delegating manager passes that
#   notification on.
# - 0004: llvmpipe's memory on Mikros is buffers of the render instance
#   of the basic graphics adapter, the GPU device with RENDER and the
#   vendor and device IDs 0, which the screen opens through the
#   directory: each allocation is a buffer whose memory object it maps,
#   and freeing it destroys the buffer.
# - 0005: the Mikros extensions VK_MIKROS_external_memory_handle and
#   VK_MIKROS_external_semaphore_handle in vk.xml and Mesa's Vulkan
#   headers, the same as the vulkan-headers port's, with
#   VK_USE_PLATFORM_MIKROS defined for Mesa's Vulkan code on Mikros.
# - 0006: llvmpipe exports an allocation as an export token or its memory
#   object, which it duplicates with the rights of an exported memory
#   object, and imports either through the render instance, keeping the
#   token of an imported one so that it can be exported again; it can
#   also try an import without keeping it.
# - 0007: lavapipe offers VK_MIKROS_external_memory_handle and
#   VK_KHR_external_memory_fd, whose descriptors are the C library's;
#   a successful import through the descriptor closes it, and the query
#   of a handle's properties tries the import.
# - 0008: lavapipe's timeline semaphores are kernel timelines, offered
#   through VK_MIKROS_external_semaphore_handle and
#   VK_KHR_external_semaphore_fd.
# - 0009: the Wayland platform does without wayland-server on Mikros,
#   which has the client library alone.
# - 0010: swapchain images of the image type of Mikros are linear, with
#   their memory exported as an export token, and their acquire and
#   release points on kernel timelines exported from timeline
#   semaphores, whose release points the CPU waits for.
# - 0011: Wayland surfaces on Mikros present through mikros_buffer_v1
#   alone: images become buffers with create_from_token, timelines are
#   imported with import_timeline, each present sets the acquire and
#   release points of a surface's sync object, and the formats are
#   those the compositor sends; the option mikros-buffer-xml names the
#   compositor's protocol file.
# - 0012: lavapipe checks the result of os_get_total_physical_memory,
#   and reports its default heap size when the size is unknown, and not
#   whatever the variable held.

[source]
url = "https://archive.mesa3d.org/mesa-26.3.1.tar.xz"
sha256 = "4e4e438eac7b840a9383988cbb7c08dad8041da544b9319fc26d319fa7348961"
dir = "mesa-26.3.1"

[build]
options = [
    "-Dplatforms=wayland",
    "-Dvulkan-drivers=swrast",
    "-Dgallium-drivers=llvmpipe",
    "-Dopengl=false",
    "-Dgles1=disabled",
    "-Dgles2=disabled",
    "-Degl=disabled",
    "-Dgbm=disabled",
    "-Dglx=disabled",
    "-Dllvm=enabled",
    "-Dshared-llvm=enabled",
    "-Dcpp_rtti=false",
    "-Dshader-cache=disabled",
    "-Dxmlconfig=disabled",
    "-Dexpat=disabled",
    "-Dzstd=disabled",
    "-Dzlib=disabled",
    "-Dvalgrind=disabled",
    "-Dlibunwind=disabled",
    "-Dlmsensors=disabled",
    "-Dbuild-tests=false",
    "-Dvulkan-layers=",
    "-Dvideo-codecs=",
    "-Dspirv-tools=disabled",
]

# Only the desktop edition of the system installs the driver and its
# manifest (MIKSPEC-0023.R53).
[editions]
"libraries/libvulkan_lvp.dlib" = ["desktop"]
"share/vulkan/icd.d/lvp_icd.x86_64.json" = ["desktop"]
