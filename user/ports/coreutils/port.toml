# uutils coreutils, the command-line utilities, built with the standard
# library of Mikros. The rewrites apply to every file of the release and
# of the crates below that are `rewritten`, when they are unpacked; the
# other changes are the patch files, in patches/ for the release and in
# crates/<name>-<version>/ for a crate.

[source]
url = "https://github.com/uutils/coreutils/archive/refs/tags/0.12.0.tar.gz"
sha256 = "4fb327655cb4ffcbf2f16550cf9234079ffe839692f7aa1a6eda104af684e122"
dir = "coreutils-0.12.0"
# Mikros where Linux, or Linux with musl, is meant.
rewrites = [
    ['target_os = "linux"', 'any(target_os = "linux", target_os = "mikros")'],
    ['target_env = "musl"', 'any(target_env = "musl", target_os = "mikros")'],
]

# The crates that need Mikros changes, with the checksums that the
# release's Cargo.lock gives them.
