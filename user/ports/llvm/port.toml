# LLVM for Mikros: the C++ runtimes libunwind, libc++abi and libc++, and
# LLVM's libraries as libLLVM.dlib, for the X86 target only.
# Its release is the toolchain's, pinned in xtask/src/llvm.rs, and xtask
# refuses to build when the two differ; the source archive is the one
# the toolchain fetched. Only the parts of the source that the port
# builds are unpacked, without their tests, in target/sources/llvm. The
# patches:
# - 0001: libc++ takes the locale functions of the Linux support header
#   on Mikros, whose C library has them.
# - 0002: LLVM on Mikros links no libm, whose functions the C library
#   has, takes the byte order from <endian.h>, and counts every file
#   system as remote, since statvfs does not tell them apart.
# - 0003: libc++abi defines __cxa_thread_atexit on Mikros, as it does on
#   Linux, so that thread-local objects with destructors link; the C
#   library has no __cxa_thread_atexit_impl (xtask tells the build so),
#   so it uses its own list of destructors, run by a thread-specific key.

[source]
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.4/llvm-project-23.1.4.src.tar.xz"
sha256 = "819ecf7351f1a66f76b2d701d8942faaf5faeb324cb90c9d5b090de142434bb2"
dir = "llvm-project-23.1.4.src"

# Only the desktop edition of the system installs libLLVM.dlib, which
# lavapipe needs; the C++ runtimes are in every edition (MIKSPEC-0023.R53).
[editions]
"libraries/libLLVM.dlib" = ["desktop"]
