# SDL3, as the position-independent static library libSDL3.slib, built
# for the tests and the components of Mikros that use it. It is built
# from the commit of the `mikros` branch of the Mikros fork,
# GetMikros/SDL, whose commits stand on the release-3.4.20 tag of
# upstream (MIKSPEC-0062.R9). The branch's changes:
# - the CMake build knows Mikros as a platform, whose C library has the
#   pthread functions and no libpthread;
# - the Wayland driver's check does not ask for EGL, which Mikros does not
#   have, though for the libraries of cursor themes and EGL windows,
#   which its libwayland has;
# - Vulkan is offered on Mikros, with the loader libvulkan.dlib;
# - SDL_CloseFileDialogs closes the file dialogs that are still open;
# - the Wayland driver does not dereference a missing data device when the
#   keyboard leaves a window.
# Only the Wayland video driver is built, with the dummy and offscreen
# ones, and no audio but the dummy and disk drivers; libwayland and
# xkbcommon are linked, not loaded when they are first used.

[source]
url = "https://github.com/GetMikros/SDL/archive/617f74c8dd08ff576ba876c5a23208e0f9092d94.tar.gz"
sha256 = "49c224872e5b4309a9b93366b4b673f6daf48d10ee31273c44c2cf4e66a0254f"
dir = "SDL-617f74c8dd08ff576ba876c5a23208e0f9092d94"

[build]
options = [
    "-DSDL_SHARED=OFF",
    "-DSDL_STATIC=ON",
    "-DSDL_STATIC_PIC=ON",
    "-DSDL_TESTS=OFF",
    "-DSDL_TEST_LIBRARY=OFF",
    "-DSDL_EXAMPLES=OFF",
    "-DSDL_X11=OFF",
    "-DSDL_WAYLAND=ON",
    "-DSDL_WAYLAND_LIBDECOR=OFF",
    "-DSDL_DEPS_SHARED=OFF",
    "-DSDL_OPENGL=OFF",
    "-DSDL_OPENGLES=OFF",
    "-DSDL_KMSDRM=OFF",
]
