# Abseil, the C++ library that Dawn is written against, from the Mikros
# fork, GetMikros/abseil-cpp: its commit of the `mikros` branch, whose
# commits stand on the 20260107.1 release of upstream (MIKSPEC-0062.R9),
# the release that Elegance's build of Dawn uses. The branch's changes:
# - Mikros is a platform with mmap, which abseil's low level allocator,
#   thread identities and per-thread semaphores, and so its mutexes,
#   need;
# - Mikros is a platform whose raw logging writes with write(2), so that
#   its fatal checks say what failed.
# It is only unpacked here: Dawn's own build files build it, as part of
# Dawn (user/ports/dawn), which is why this port has no [build] table.
# Apache-2.0.

