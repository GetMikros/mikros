[package]
name = "termsvc"
version.workspace = true
edition.workspace = true
license = "MPL-2.0"
publish = false

[[bin]]
name = "termsvc"
path = "src/service/mod.rs"

[dependencies]
mikros-rt = { path = "../../runtime/mikros-rt" }
mikros-tty = { path = "../../lib/tty" }

[package.metadata.mikros]
kind = "service"
image = "system"
runtime = "rt"
manifest = "terminal.yaml"
