# The service manifest of the terminal service, installed as
# usr/lib/services/terminal.yaml.
name: terminal
binary: /usr/bin/termsvc
start: on-demand
# To signal process groups and look at processes of every user, and to
# ask the broker about permissions.
permissions: [process.signal_any, process.list_all, permissions.check]
provides:
  - protocol: mikros.terminal.Factory
  - protocol: mikros.terminal.Terminal
