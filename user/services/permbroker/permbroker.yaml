# The service manifest of the permission broker, installed as
# system/services/system.permbroker/service.yaml.
name: permbroker
binary: /system/services/system.permbroker/permbroker
start: boot
# To reach the root file system and the temporary file system, where the
# broker keeps its grants.
# To kill a service that does not confirm a revocation in time.
# To tell whether a process that it answered still runs, whichever its user.
permissions:
  - system.filesystems.mount
  - system.processes.control
  - system.processes.read
provides:
  - protocol: mikros.permissions.Broker
  # The numbers of app IDs, for every process; Number needs
  # system.permissions.read, which the broker checks.
  - protocol: mikros.permissions.AppNumbers
  # Questions about the caller's own permissions, for every process
  # (MIKSPEC-0094.R5).
  - protocol: mikros.permissions.Permissions
  # The grants of manifests and grant lists (MIKSPEC-0037.R65); List needs
  # system.grants.manage, which the broker checks.
  - protocol: mikros.permissions.SystemGrants
