# The service manifest of the time service, installed as
# system/services/system.timesvc/service.yaml.
name: timesvc
binary: /system/services/system.timesvc/timesvc
start: boot
boot_handles: [platform_info]
# admin.time.set also to reach the real-time clock's device.rtc.
permissions: [system.permissions.read, system.filesystems.mount, admin.time.set]
provides:
  - protocol: mikros.time.Clock
