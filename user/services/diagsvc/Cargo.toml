[package]
name = "diagsvc"
version.workspace = true
edition.workspace = true
license = "MPL-2.0"
publish = false

[target.'cfg(target_os = "mikros")'.dependencies]
mikros-rt = { path = "../../runtime/mikros-rt" }

# The diagnostic build sets `mikros_diag`, and the parts that only run on
# Mikros are left out of the host's tests.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("mikros"))', "cfg(mikros_diag)"] }

[package.metadata.mikros]
kind = "service"
image = "system"
runtime = "rt"
manifest = "diag.yaml"
kinds = ["diag"]
