# The service manifest of the diagnostic service, installed as
# usr/lib/services/diagsvc.yaml in the diagnostic build only.
name: diagsvc
binary: /usr/bin/diagsvc
start: boot
boot_handles: [root_resource]
# system.permissions.read to check its clients' system.diagnostics.read.
permissions: [system.processes.read, system.permissions.read]
provides:
  - protocol: mikros.diag.Overview
