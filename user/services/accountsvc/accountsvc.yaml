# The service manifest of the accounts service, installed as
# usr/lib/services/accountsvc.yaml.
name: accountsvc
binary: /usr/bin/accountsvc
start: boot
after: [tmpfs]
provides:
  - protocol: mikros.session.Accounts
namespace:
  - path: /var/lib/accounts
    rights: rw
  - path: /Users
    rights: rw
# system.subvolumes.manage is only for creating and deleting the subvolumes of
# users' home folders on the root file system.
permissions: [system.permissions.read, session.authorize, system.subvolumes.manage]
