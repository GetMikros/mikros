# The service manifest of the accounts service, installed as
# system/services/system.accountsvc/service.yaml.
name: accountsvc
binary: /system/services/system.accountsvc/accountsvc
start: boot
after: [tmpfs]
provides:
  - protocol: mikros.session.Accounts
namespace:
  - path: /system/state/accounts
    rights: rw
  - path: /users
    rights: rw
# system.subvolumes.manage is only for creating and deleting the subvolumes of
# users' home folders on the root file system.
permissions: [system.permissions.read, system.subvolumes.manage]
