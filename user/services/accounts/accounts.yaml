# The service manifest of the accounts service, installed as
# usr/lib/services/accounts.yaml.
name: accounts
binary: /usr/bin/accounts
start: boot
after: [tmpfs]
provides:
  - protocol: mikros.session.Accounts
namespace:
  - path: /var/lib/accounts
    rights: rw
  - path: /Users
    rights: rw
# filesystem.manage is only for creating and deleting the subvolumes of
# users' home folders on the root file system.
permissions: [permissions.check, session.authorize, filesystem.manage]
