# The service manifest of the log service, installed as
# system/services/system.logsvc/service.yaml.
name: logsvc
binary: /system/services/system.logsvc/logsvc
start: boot
boot_handles: [log_manage, platform_info]
permissions: [system.filesystems.mount]
provides:
  - protocol: mikros.log.Writer
  # Each app's own records and its components' (MIKSPEC-0063.R19).
  - protocol: mikros.log.OwnReader
  - protocol: mikros.log.Reader
    permission: admin.logs.read
  - protocol: mikros.log.Sources
    permission: system.log_sources.create
  # The output and error that the process manager gives processes
  # (MIKSPEC-0063.R21), which only it may add.
  - protocol: mikros.log.ProcessSources
