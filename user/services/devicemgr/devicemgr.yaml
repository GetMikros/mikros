# The service manifest of the device manager, installed as
# usr/lib/services/devicemgr.yaml.
name: devicemgr
binary: /usr/bin/devicemgr
start: boot
boot_handles: [root_resource, log_manage, framebuffer, platform_info]
permissions: [process.set_identity, permissions.check, permissions.grant_system, services.register, filesystem.mount]
# Removing every device at shutdown may wait up to 60 s for each driver.
stop_timeout: 600
provides:
  - protocol: mikros.driver.Removal
    permission: files.volumes
namespace:
  - path: /usr/lib/drivers
    rights: rx
