# The service manifest of the device manager, installed as
# system/services/system.devicemgr/service.yaml.
name: devicemgr
binary: /system/services/system.devicemgr/devicemgr
start: boot
boot_handles: [root_resource, log_manage, framebuffer, platform_info]
permissions: [system.identity.set, system.permissions.read, system.permissions.set, system.services.create, system.filesystems.mount]
# Removing every device at shutdown may wait up to 60 s for each driver.
stop_timeout: 600
provides:
  - protocol: mikros.driver.Removal
    permission: user.volumes.access
  - protocol: mikros.driver.Shutdown
    permission: admin.power.control
  # For the service manager alone, which the device manager checks.
  - protocol: mikros.driver.RootDrivers
  # The named devices, for every process.
  - protocol: mikros.driver.Devices
  # The volumes, for every process; ejecting and mounting one asks for
  # the permissions they need.
  - protocol: device.volumes
namespace:
  - path: /system/drivers
    rights: rx
