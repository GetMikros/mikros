# The service manifest of the temporary file system, installed as
# system/services/system.tmpfs/service.yaml.
name: tmpfs
binary: /system/services/system.tmpfs/tmpfs
start: boot
provides:
  - protocol: mikros.fs.Filesystem
    permission: system.filesystems.mount
  - protocol: mikros.fs.TemporaryFilesystem
    permission: system.filesystems.mount
