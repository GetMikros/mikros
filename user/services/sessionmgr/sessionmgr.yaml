# The service manifest of the session manager, installed as
# system/services/system.sessionmgr/service.yaml.
name: sessionmgr
binary: /system/services/system.sessionmgr/sessionmgr
start: boot
after: [devicemgr, accountsvc]
# To start the text console, the setup program and users' shells,
# and the dynamic linker they load.
namespace:
  - path: /system
    rights: rx
  # The session settings.
  - path: /system/config
    rights: r
permissions:
  - system.user_id.set
  - system.identity.set
  - system.users.authenticate
  - system.display.control
  - system.input.control
  - admin.power.control
  # To find the console of an Authorize client's login session, and
  # whether the client still runs.
  - system.processes.read
  # To be the broker's prompter, which asks users for permissions.
  - system.prompts.use
  # To mark the boot good once the console has started.
  - system.boot_state.set
provides:
  # For the permission broker alone, which the session manager checks.
  - protocol: mikros.session.Authorization
  # For every process of a login session; sudo calls it.
  - protocol: mikros.session.Elevation
  # For every process; StartDesktop checks the caller's login session.
  - protocol: mikros.session.Desktop
  # For every app: the Wayland connections, the opener and the file picker,
  # which are forwarded to the compositor of the user's session
  # (MIKSPEC-0066.R35).
  - protocol: wayland
  - protocol: mikros.desktop.Opener
  - protocol: mikros.desktop.FilePicker
