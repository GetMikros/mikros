[package]
name = "processmgr"
version.workspace = true
edition.workspace = true
license = "MPL-2.0"
publish = false

[target.'cfg(target_os = "mikros")'.dependencies]
mikros-acl = { path = "../../lib/acl", features = ["midl"] }
mikros-mika = { path = "../../lib/mika" }
mikros-bootfs = { path = "../../lib/bootfs" }
mikros-loader = { path = "../../lib/loader" }
mikros-manifest = { path = "../../lib/manifest" }
mikros-rt = { path = "../../runtime/mikros-rt" }

[package.metadata.mikros]
kind = "core"
image = "boot"
runtime = "rt"

# The parts that only run on Mikros are left out of the host's tests.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("mikros"))'] }
