[package]
name = "msh"
version.workspace = true
edition.workspace = true
license = "MPL-2.0"
publish = false

[[bin]]
name = "msh"
path = "src/program/mod.rs"

[dependencies]
mikros-msh = { path = "../../../lib/msh" }

# No program manifest: the session manager starts msh with the app ID
# `system.cli`, which needs none.
[package.metadata.mikros]
kind = "program"
image = "system"
