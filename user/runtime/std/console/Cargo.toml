[package]
name = "console"
version.workspace = true
edition.workspace = true
license = "MPL-2.0"
publish = false

[[bin]]
name = "console"
path = "src/program/mod.rs"

[dependencies]
mikros-evdev = { path = "../../../lib/evdev" }
mikros-logview = { path = "../../../lib/logview" }
mikros-rt = { path = "../../mikros-rt", default-features = false }
mikros-vt = { path = "../../../lib/vt" }

# The diagnostic build sets `mikros_diag`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(mikros_diag)"] }

[package.metadata.mikros]
kind = "program"
image = "system"
manifest = "system.console.yaml"
