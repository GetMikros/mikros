# Programs that use the Rust standard library, which `cargo xtask`
# builds from the patched source that `xtask/src/rust_std.rs` prepares.
# Cargo alone cannot build them.
[workspace]
resolver = "3"
members = ["console", "msh", "setup", "tests/coreutils-check", "tests/hello-std", "tests/msh-check", "tests/spawn-std"]

[workspace.package]
version = "0.0.0"
edition = "2024"

[profile.fuzz]
inherits = "dev"

# The diagnostic build kind: the production build's optimization with
# debug assertions and overflow checks.
[profile.diag]
inherits = "release"
debug-assertions = true
overflow-checks = true
