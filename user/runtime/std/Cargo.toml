# Programs that use the Rust standard library, which `cargo xtask`
# builds from the patched source that `xtask/src/rust_std.rs` prepares.
# Cargo alone cannot build them.
[workspace]
resolver = "3"
members = ["console", "setup", "tests/hello-std", "tests/spawn-std"]

[workspace.package]
version = "0.0.0"
edition = "2024"

[profile.fuzz]
inherits = "dev"
