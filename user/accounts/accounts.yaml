# The service manifest of the accounts service, installed as
# usr/lib/services/accounts.yaml.
name: accounts
binary: /usr/bin/accounts
start: boot
after: [tmpfs]
provides:
  - protocol: mikros.session.Accounts
namespace:
  - path: /var/lib/accounts
    rights: rw
  - path: /Users
    rights: rw
permissions: [permissions.check, session.authorize]
