[package]
name = "selftest"
version.workspace = true
edition.workspace = true
license = "MPL-2.0"
publish = false

[target.'cfg(target_os = "mikros")'.dependencies]
mikros-rt = { path = "../../runtime/mikros-rt", default-features = false }

# Only test images hold it.
[package.metadata.mikros]
kind = "program"
image = "tests"
manifest = "system.selftest.yaml"

# The parts that only run on Mikros are left out of the host's tests.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("mikros"))'] }
