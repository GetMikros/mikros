[package]
name = "msh"
version.workspace = true
edition.workspace = true
license = "MPL-2.0"
publish = false

[dependencies]
regex = "1"

# No program manifest: the session manager starts msh with the app ID
# `system.cli`, which needs none.
[package.metadata.mikros]
kind = "program"
image = "system"

# The parts that only run on Mikros are left out of the host's tests.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("mikros"))'] }
