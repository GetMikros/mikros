[package]
name = "less"
version.workspace = true
edition.workspace = true
license = "MPL-2.0"
publish = false

[dependencies]
mikros-cli = { path = "../../lib/cli" }

# It reads only its input and its terminal, so it needs no program
# manifest.
[package.metadata.mikros]
kind = "program"
image = "system"
completions = "less.msh"

# The parts that only run on Mikros are left out of the host's tests.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("mikros"))'] }
