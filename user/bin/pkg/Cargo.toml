[package]
name = "pkg"
version.workspace = true
edition.workspace = true
license = "MPL-2.0"
publish = false

[dependencies]
mikros-cli = { path = "../../lib/cli" }
mikros-mika = { path = "../../lib/mika" }

# A command: it installs, removes, lists, shows and makes packages through
# the install service, which asks for the permissions that installs need.
[package.metadata.mikros]
kind = "program"
image = "system"
manifest = "system.pkg.yaml"

# The parts that only run on Mikros are left out of the host's tests.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("mikros"))'] }
