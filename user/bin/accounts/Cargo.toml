[package]
name = "accounts"
version.workspace = true
edition.workspace = true
license = "MPL-2.0"
publish = false

[dependencies]
mikros-cli = { path = "../../lib/cli" }

[target.'cfg(target_os = "mikros")'.dependencies]
mikros-command = { path = "../../lib/command" }
mikros-rt = { path = "../../runtime/mikros-rt", default-features = false }

# A command: it runs with the app ID system.accounts, which may change
# the users once the accounts service has an administrator's
# authorization.
[package.metadata.mikros]
kind = "program"
image = "system"
manifest = "system.accounts.yaml"
completions = "accounts.msh"

# The parts that only run on Mikros are left out of the host's tests.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("mikros"))'] }
