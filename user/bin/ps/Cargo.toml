[package]
name = "ps"
version.workspace = true
edition.workspace = true
license = "MPL-2.0"
publish = false

[dependencies]
mikros-cli = { path = "../../lib/cli" }

# A command: it runs with the app ID system.ps, which may list every
# process.
[package.metadata.mikros]
kind = "program"
image = "system"
manifest = "system.ps.yaml"
completions = "ps.msh"

# The parts that only run on Mikros are left out of the host's tests.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("mikros"))'] }
