[package]
name = "ls"
version.workspace = true
edition.workspace = true
license = "MPL-2.0"
publish = false

[dependencies]
mikros-cli = { path = "../../lib/cli" }

[target.'cfg(target_os = "mikros")'.dependencies]
mikros-command = { path = "../../lib/command" }

# A rewrite of a command of the uutils port, beside it until the switch.
# It reads folders through the standard library, which needs no program
# manifest.
[package.metadata.mikros]
kind = "utility"
image = "system"
completions = "ls.msh"

# The parts that only run on Mikros are left out of the host's tests.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("mikros"))'] }
