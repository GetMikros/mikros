[package]
name = "date"
version.workspace = true
edition.workspace = true
license = "MPL-2.0"
publish = false

[dependencies]
mikros-cli = { path = "../../lib/cli" }
mikros-tz = { path = "../../lib/tz" }

[target.'cfg(target_os = "mikros")'.dependencies]
mikros-command = { path = "../../lib/command" }
mikros-rt = { path = "../../runtime/mikros-rt", default-features = false }

# One of the commands that replaced the uutils port (MIKSPEC-0098.R4).
# Its manifest holds no permission: setting the time needs
# admin.time.set, for which the time service asks, naming date.
[package.metadata.mikros]
kind = "program"
image = "system"
manifest = "system.date.yaml"
completions = "date.msh"

# The parts that only run on Mikros are left out of the host's tests.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("mikros"))'] }
