# The manifest of the exFAT server, installed as
# system/drivers/system.driver.exfat/driver.yaml.
name: exfat
binary: /system/drivers/system.driver.exfat/exfat
match:
  # Any partition whose first bytes hold exFAT.
  - fs:exfat
kind: normal
# The rules of the system time zone, for the volume's local times.
namespace:
  - path: /system/share/zoneinfo
    rights: r
