[package]
name = "ps2"
version.workspace = true
edition.workspace = true
license = "MPL-2.0"
publish = false

[[bin]]
name = "ps2"
path = "src/driver.rs"

[dependencies]
mikros-evdev = { path = "../../lib/evdev" }
mikros-inputdev = { path = "../../lib/inputdev" }
mikros-ps2 = { path = "../../lib/ps2" }
mikros-rt = { path = "../../runtime/mikros-rt" }

[package.metadata.mikros]
kind = "driver"
image = "boot"
runtime = "rt"
