# The manifest of the PCI bus driver, installed as
# system/drivers/system.driver.pcibus/driver.yaml.
name: pcibus
binary: /system/drivers/system.driver.pcibus/pcibus
match: [platform:pci-host-ecam]
kind: normal
needs: [bus, dma]
# To ask the ACPI server for INTx routes.
permissions: [system.devices.manage]
