[package]
name = "btrfs"
version.workspace = true
edition.workspace = true
license = "GPL-2.0-only"
publish = false

[[bin]]
name = "btrfs"
path = "src/driver/mod.rs"

[dependencies]
mikros-btrfs = { path = "../../lib/btrfs" }
mikros-casefold = { path = "../../lib/casefold" }
mikros-rt = { path = "../../runtime/mikros-rt" }

[package.metadata.mikros]
kind = "driver"
image = "boot"
runtime = "rt"
