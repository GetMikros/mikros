# The manifest of the ACPI server, installed as
# system/drivers/system.driver.acpi/driver.yaml.
name: acpi
binary: /system/drivers/system.driver.acpi/acpi
match: [platform:acpi]
kind: normal
needs: [bus, ioports]
# To ask the permission broker whether a client may power the machine
# off or restart it.
permissions: [system.permissions.read, system.permissions.request]
