[package]
name = "fat"
version.workspace = true
edition.workspace = true
license = "MPL-2.0"
publish = false

# The server, which the FAT server, src/bin/fat.rs, runs.
[lib]
name = "fat_server"

[dependencies]
mikros-fat = { path = "../../lib/fat" }
mikros-rt = { path = "../../runtime/mikros-rt" }
mikros-tz = { path = "../../lib/tz" }

[package.metadata.mikros]
kind = "driver"
image = "boot"
runtime = "rt"
