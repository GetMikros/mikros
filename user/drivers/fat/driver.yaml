# The manifest of the FAT server, installed as
# system/drivers/system.driver.fat/driver.yaml.
name: fat
binary: /system/drivers/system.driver.fat/fat
match:
  # The EFI system partition.
  - gpt:c12a7328-f81f-11d2-ba4b-00a0c93ec93b
  # Any other partition whose first bytes hold FAT.
  - fs:fat
kind: normal
# The rules of the system time zone, for the volume's local times.
namespace:
  - path: /system/share/zoneinfo
    rights: r
