[package]
name = "virtiogpu"
version.workspace = true
edition.workspace = true
license = "MPL-2.0"
publish = false

[target.'cfg(target_os = "mikros")'.dependencies]
mikros-display = { path = "../../lib/display" }
mikros-gpudev = { path = "../../lib/gpudev" }
mikros-rt = { path = "../../runtime/mikros-rt" }
mikros-storage = { path = "../../lib/storage" }
mikros-virtio = { path = "../../lib/virtio" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("mikros"))'] }
