[workspace]
resolver = "3"
members = ["drivers/acpi", "drivers/ahci", "drivers/basicdisplay", "drivers/btrfs", "drivers/exfat", "drivers/fat", "drivers/nvme", "drivers/partition", "drivers/pcibus", "drivers/ps2", "drivers/rtc", "drivers/usbhid", "drivers/usbstorage", "drivers/virtioblk", "drivers/xhci", "lib/bootfs", "lib/casefold", "lib/display", "lib/evdev", "lib/exfat", "lib/fat", "lib/fatserver", "lib/gpudev", "lib/inputdev", "lib/logview", "lib/manifest", "lib/tz", "lib/userdb", "lib/ustar", "lib/virtio", "lib/yaml", "runtime/libc", "runtime/mikros-rt", "runtime/std/console", "runtime/std/msh", "runtime/std/setup", "runtime/std/tests/coreutils-check", "runtime/std/tests/hello-std", "runtime/std/tests/msh-check", "runtime/std/tests/spawn-std", "services/accounts", "services/devicemgr", "services/diagsvc", "services/init", "services/loader", "services/logsvc", "services/permbroker", "services/processmgr", "services/servicemgr", "services/sessionmgr", "services/storage", "services/termsvc", "services/timesvc", "services/tmpfs", "services/union", "tests/accounts-probe", "tests/broker-probe", "tests/call-server", "tests/channel-echo", "tests/debuggee", "tests/directory-probe", "tests/drivers/test-driver", "tests/init", "tests/input-probe", "tests/launcher-probe", "tests/log-probe", "tests/managed", "tests/namespace-probe", "tests/pie", "tests/port-tests", "tests/power-probe", "tests/restart-probe", "tests/session-shell", "tests/support", "tests/term-probe", "tests/time-probe", "tests/tmpfs-probe", "tests/union-probe", "tests/volumes-probe"]
# The packages with tests that run on the host, which plain `cargo test`
# and `cargo clippy` in user/ check.
default-members = ["drivers/ahci", "drivers/btrfs", "drivers/nvme", "drivers/partition", "drivers/pcibus", "drivers/ps2", "drivers/rtc", "drivers/usbhid", "lib/bootfs", "lib/casefold", "lib/display", "lib/evdev", "lib/exfat", "lib/fat", "lib/logview", "lib/manifest", "lib/tz", "lib/userdb", "lib/ustar", "lib/yaml", "runtime/std/console", "runtime/std/msh", "services/diagsvc", "services/logsvc", "services/permbroker", "services/termsvc", "services/tmpfs"]

[workspace.package]
version = "0.0.0"
edition = "2024"

# Programs are built by `cargo xtask`, which builds the standard library
# for them from the patched source that `xtask/src/rust_std.rs` prepares,
# or, for programs without it, only the core and alloc libraries, and
# then makes them abort on panic.

# Unoptimized, one password hash takes many seconds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.fuzz]
inherits = "dev"

# The diagnostic build kind: the production build's optimization with
# debug assertions and overflow checks.
[profile.diag]
inherits = "release"
debug-assertions = true
overflow-checks = true
