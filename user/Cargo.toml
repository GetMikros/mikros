[workspace]
resolver = "3"
members = ["drivers/acpi", "drivers/basicdisplay", "drivers/ahci", "drivers/btrfs", "drivers/exfat", "drivers/fat", "drivers/nvme", "drivers/partition", "drivers/pcibus", "drivers/ps2", "drivers/rtc", "drivers/usbhid", "drivers/usbstorage", "drivers/virtioblk", "drivers/xhci", "lib/inputdev", "lib/virtio", "runtime/acpica", "runtime/libc", "runtime/mikros-rt", "services/accounts", "services/devicemgr", "services/init", "services/loader", "services/logsvc", "services/permbroker", "services/processmgr", "services/servicemgr", "services/sessionmgr", "services/storage", "services/termsvc", "services/timesvc", "services/tmpfs", "services/union", "tests/accounts-probe", "tests/broker-probe", "tests/call-server", "tests/channel-echo", "tests/debuggee", "tests/directory-probe", "tests/drivers/test-driver", "tests/init", "tests/input-probe", "tests/launcher-probe", "tests/log-probe", "tests/managed", "tests/namespace-probe", "tests/pie", "tests/port-tests", "tests/power-probe", "tests/restart-probe", "tests/session-shell", "tests/support", "tests/term-probe", "tests/time-probe", "tests/tmpfs-probe", "tests/union-probe", "tests/volumes-probe"]
# Built here as a dependency, and host-tested in the root workspace,
# except `std`, a workspace of its own for programs that use the
# standard library.
exclude = ["lib/ata", "lib/bootfs", "lib/btrfs", "lib/casefold", "lib/cmos", "lib/display", "lib/evdev", "lib/exfat", "lib/fat", "lib/gpt", "lib/hid", "lib/logstore", "lib/logview", "lib/manifest", "lib/memfs", "lib/nvme", "lib/pci", "lib/ps2", "lib/permissions", "lib/tty", "lib/tz", "lib/userdb", "lib/vt", "lib/ustar", "lib/yaml", "runtime/std"]

[workspace.package]
version = "0.0.0"
edition = "2024"

# Programs built without the standard library abort on panic.
[profile.dev]
panic = "abort"

# Unoptimized, one password hash takes many seconds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
panic = "abort"

[profile.fuzz]
inherits = "dev"
