[workspace.package]
version = "0.0.0"
edition = "2024"

# Programs are built by `cargo xtask`, which builds the standard library
# for them from the patched source that `xtask/src/rust_std.rs` prepares,
# or, for programs without it, only the core and alloc libraries, and
# then makes them abort on panic.

# Unoptimized, one password hash takes many seconds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
# Unoptimized, the text console draws a program's output some 16 times
# slower, and still shows the output of `yes` for seconds after ^C ended
# it.
[profile.dev.package.console]
opt-level = 2

[profile.fuzz]
inherits = "dev"

# The diagnostic build kind: the production build's optimization with
# debug assertions and overflow checks.
[profile.diag]
inherits = "release"
debug-assertions = true
overflow-checks = true
