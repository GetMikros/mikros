[workspace]
resolver = "3"
members = ["device-manager", "init", "libc", "loader", "mikros-rt", "permissions-broker", "process-manager", "service-manager", "tests/broker-probe", "tests/call-server", "tests/channel-echo", "tests/debuggee", "tests/directory-probe", "tests/drivers/test-driver", "tests/init", "tests/launcher-probe", "tests/managed", "tests/pie", "tests/port-tests", "tests/support"]
# Built here as a dependency, and host-tested in the root workspace,
# except `std`, a workspace of its own for programs that use the
# standard library.
exclude = ["bootfs", "manifest", "pci", "permissions", "std", "ustar", "yaml"]

[workspace.package]
version = "0.0.0"
edition = "2024"

# Programs built without the standard library abort on panic.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[profile.fuzz]
inherits = "dev"
