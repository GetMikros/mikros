[workspace]
resolver = "3"
members = ["init", "mikros-rt", "tests/call-server", "tests/channel-echo", "tests/init", "tests/support"]

[workspace.package]
version = "0.0.0"
edition = "2024"

# Programs built without the standard library abort on panic.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[profile.fuzz]
inherits = "dev"
