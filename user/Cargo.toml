[workspace]
resolver = "3"
members = ["accounts", "runtime/acpica", "device-manager", "drivers/acpi", "drivers/ahci", "drivers/btrfs", "drivers/exfat", "drivers/fat", "drivers/nvme", "drivers/partition", "drivers/pci-bus", "drivers/rtc", "drivers/usb-storage", "drivers/virtio-blk", "drivers/xhci", "storage", "time-service", "lib/virtio", "init", "runtime/libc", "loader", "log-service", "runtime/mikros-rt", "permissions-broker", "process-manager", "service-manager", "tmpfs", "union", "tests/accounts-probe", "tests/broker-probe", "tests/call-server", "tests/channel-echo", "tests/debuggee", "tests/directory-probe", "tests/drivers/test-driver", "tests/init", "tests/launcher-probe", "tests/log-probe", "tests/managed", "tests/namespace-probe", "tests/time-probe", "tests/tmpfs-probe", "tests/union-probe", "tests/volumes-probe", "tests/pie", "tests/port-tests", "tests/power-probe", "tests/restart-probe", "tests/support"]
# Built here as a dependency, and host-tested in the root workspace,
# except `std`, a workspace of its own for programs that use the
# standard library.
exclude = ["lib/ata", "lib/bootfs", "lib/btrfs", "lib/casefold", "lib/cmos", "lib/exfat", "lib/fat", "lib/gpt", "lib/logstore", "lib/manifest", "lib/memfs", "lib/nvme", "lib/pci", "lib/permissions", "runtime/std", "lib/tz", "lib/userdb", "lib/ustar", "lib/yaml"]

[workspace.package]
version = "0.0.0"
edition = "2024"

# Programs built without the standard library abort on panic.
[profile.dev]
panic = "abort"

# Unoptimized, one password hash takes many seconds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
panic = "abort"

[profile.fuzz]
inherits = "dev"
