[workspace]
resolver = "3"
members = ["init", "loader", "mikros-rt", "process-manager", "tests/call-server", "tests/channel-echo", "tests/debuggee", "tests/init", "tests/managed", "tests/pie", "tests/support", "ustar"]

[workspace.package]
version = "0.0.0"
edition = "2024"

# Programs built without the standard library abort on panic.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[profile.fuzz]
inherits = "dev"
