[package]
name = "test-init"
version.workspace = true
edition.workspace = true
license = "MPL-2.0"
publish = false

[dependencies]
mikros-loader = { path = "../../services/loader" }
mikros-rt = { path = "../../runtime/mikros-rt" }
mikros-test = { path = "../support" }
processmgr = { path = "../../services/processmgr" }

[features]
# Tests the system calls that exist only in fuzz builds.
fuzz = ["mikros-rt/fuzz"]

[build-dependencies]
midlc = { path = "../../../tools/midlc" }

[package.metadata.mikros]
runtime = "rt"
