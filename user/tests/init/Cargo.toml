[package]
name = "test-init"
version.workspace = true
edition.workspace = true
license = "MPL-2.0"
publish = false

[dependencies]
mikros-loader = { path = "../../lib/loader" }
mikros-rt = { path = "../../runtime/mikros-rt" }
mikros-test = { path = "../support" }
mikros-bootfs = { path = "../../lib/bootfs" }

[features]
# Tests the system calls that exist only in fuzz builds.
fuzz = ["mikros-rt/fuzz"]

[package.metadata.mikros]
runtime = "rt"
