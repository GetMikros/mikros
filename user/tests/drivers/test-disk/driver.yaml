# A driver for each partition that the partition driver adds on the
# test machine's disks, for the storage tests. It grants itself
# user.volumes.access through the broker, without an administrator, to
# reach the device manager's removal service.
name: test-disk
binary: /system/drivers/system.driver.test-disk/test-disk
match: [storage:partition]
permissions: [system.grants.manage, admin.grants.manage]
