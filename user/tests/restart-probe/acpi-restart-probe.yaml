# The service manifest of the restart probe as the boot service of
# tests/acpi-restart.img, installed as
# system/services/system.acpi-restart-probe/service.yaml. It logs through the kernel
# log.
name: acpi-restart-probe
binary: /system/services/system.restart-probe/restart-probe
start: boot
after: [devicemgr]
boot_handles: [log_manage]
# To kill the ACPI server, and to reach the real-time clock's service.
permissions: [system.processes.control, admin.time.set]
