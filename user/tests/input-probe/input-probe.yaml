# The service manifest of the input probe as the boot service of
# tests/input.img, installed as system/services/system.input-probe/service.yaml. It
# logs through the kernel log.
name: input-probe
binary: /system/services/system.input-probe/input-probe
start: boot
after: [devicemgr]
boot_handles: [log_manage]
# To own the display and read the input devices; default.gpu.use, which
# connecting to the gpu service also needs, is held by default.
permissions: [system.display.control, system.input.control]
