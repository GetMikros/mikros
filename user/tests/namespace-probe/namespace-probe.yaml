# The manifest of the probe of namespaces built from the boot image, a
# boot service of the namespaces test image.
name: namespace-probe
binary: /system/services/system.namespace-probe/namespace-probe
start: boot
after: [tmpfs]
namespace:
  - path: /system/share/probe
    rights: r
  # Its folder, to start a copy of itself.
  - path: /system/services/system.namespace-probe
    rights: rx
  # Executable, so that a program copied there can be started.
  - path: /system/state/namespace-probe
    rights: rwx
  - path: /system/config
    rights: r
# To start a copy of itself as a command-line tool, and as a native app.
permissions: [system.identity.set]
