# The manifest of the probe of namespaces built from the boot image, a
# boot service of the namespaces test image.
name: namespace-probe
binary: /usr/bin/namespace-probe
start: boot
after: [tmpfs]
namespace:
  - path: /usr/share/probe
    rights: r
  # Its programs, to start a copy of itself.
  - path: /usr/bin
    rights: rx
  # Executable, so that a program copied there can be started.
  - path: /var/lib/namespace-probe
    rights: rwx
  - path: /etc
    rights: r
# To start a copy of itself as a command-line tool, and as a native app.
permissions: [process.set_identity]
