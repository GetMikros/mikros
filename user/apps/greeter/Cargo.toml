[package]
name = "greeter"
version.workspace = true
edition.workspace = true
license = "MPL-2.0"
publish = false

[target.'cfg(target_os = "mikros")'.dependencies]
elegance = { git = "https://github.com/EleganceUI/elegance-rs", rev = "d7533e6f3e44c47f519582f303fa1fa25ec853c1" }
mikros-rt = { path = "../../runtime/mikros-rt", default-features = false }

[package.metadata.mikros]
kind = "app"
name = "Greeter"
description = "The login screen"
editions = ["desktop"]
shell_parts = [{ roles = ["greeter"], executable = "greeter" }]

# The part that only runs on Mikros is left out of the host's tests.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("mikros"))'] }
