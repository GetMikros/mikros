[package]
name = "mikros-curpack"
version.workspace = true
edition.workspace = true
license = "MPL-2.0"
publish = false

# tiny-skia needs the standard library, so only programs with it use this.
[package.metadata.mikros]
runtime = "std"

[dependencies]
tiny-skia = { version = "0.12", default-features = false, features = ["std"] }
