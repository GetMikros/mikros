[package]
name = "kernel-x86_64"
version.workspace = true
edition.workspace = true
license = "MPL-2.0"
publish = false

[[bin]]
name = "kernel"
path = "src/main.rs"

[target.'cfg(target_os = "none")'.dependencies]
boot-protocol = { path = "../../../boot/protocol" }
kernel-core = { path = "../../core" }

# The host tests use the shared definitions too.
[dev-dependencies]
kernel-core = { path = "../../core" }

[build-dependencies]
syscall-table = { path = "../../syscalls" }

[features]
# Builds the system calls that exist only for fuzzing.
fuzz = []

# Every unsafe block, impl and function says why it is sound.
[lints.clippy]
undocumented_unsafe_blocks = "warn"
missing_safety_doc = "warn"
