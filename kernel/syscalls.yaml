# The Mikros system call table. The kernel's dispatch and the user-space
# bindings are generated from it by kernel/syscalls (the syscall-table
# crate) when the kernel builds.
#
# Each entry of `syscalls` has these keys:
#
#   name       the call's name
#   number     the number user space passes, unique in the table
#   arch       the architectures that provide the call
#   fuzz_only  true when the call exists only in fuzz builds
#   spec       the IDs of the requirements that define the call
#   args       the arguments in the order they are passed, each with:
#     name           the argument's name
#     type           u32, u64, i32, i64, Handle, or `*const T` or `*mut T`
#                    for a user address, where T is u8, u32, u64, i32, i64
#                    or Handle
#     dir            in, out or inout; `*mut` addresses are out or inout,
#                    everything else is in
#     object         for a Handle: the accepted object type, a list of
#                    them, or `any`
#     rights         for a Handle: the rights it must hold
#     allow_invalid  for a Handle: true when HANDLE_INVALID is accepted
#                    without checks; false when left out
#
# The dispatch checks every handle argument, in order, before the call's
# handler runs.

syscalls:
  - name: handle_close
    number: 1
    arch: [x86_64]
    fuzz_only: false
    spec: [MIKSPEC-0007.R11]
    args:
      - {name: handle, type: Handle, dir: in, object: any, rights: [], allow_invalid: true}

  - name: handle_duplicate
    number: 2
    arch: [x86_64]
    fuzz_only: false
    spec: [MIKSPEC-0007.R9]
    args:
      - {name: handle, type: Handle, dir: in, object: any, rights: [DUPLICATE]}
      - {name: rights, type: u32, dir: in}
      - {name: out, type: "*mut Handle", dir: out}

  - name: handle_replace
    number: 3
    arch: [x86_64]
    fuzz_only: false
    spec: [MIKSPEC-0007.R10]
    args:
      - {name: handle, type: Handle, dir: in, object: any, rights: []}
      - {name: rights, type: u32, dir: in}
      - {name: out, type: "*mut Handle", dir: out}

  - name: object_get_info
    number: 4
    arch: [x86_64]
    fuzz_only: false
    spec: [MIKSPEC-0007.R12]
    args:
      - {name: handle, type: Handle, dir: in, object: any, rights: [INSPECT]}
      - {name: topic, type: u32, dir: in}
      - {name: buf, type: "*mut u8", dir: out}
      - {name: len, type: u64, dir: in}
      - {name: out_len, type: "*mut u64", dir: out}

  - name: budget_create
    number: 5
    arch: [x86_64]
    fuzz_only: false
    spec: [MIKSPEC-0021.R3]
    args:
      - {name: parent, type: Handle, dir: in, object: Budget, rights: [WRITE]}
      - {name: kernel_limit, type: u64, dir: in}
      - {name: page_limit, type: u64, dir: in}
      - {name: out, type: "*mut Handle", dir: out}

  - name: budget_set_limits
    number: 6
    arch: [x86_64]
    fuzz_only: false
    spec: [MIKSPEC-0021.R4]
    args:
      - {name: budget, type: Handle, dir: in, object: Budget, rights: [MANAGE]}
      - {name: kernel_limit, type: u64, dir: in}
      - {name: page_limit, type: u64, dir: in}

  - name: budget_set_thresholds
    number: 7
    arch: [x86_64]
    fuzz_only: false
    spec: [MIKSPEC-0021.R13]
    args:
      - {name: budget, type: Handle, dir: in, object: Budget, rights: [MANAGE]}
      - {name: kernel_threshold, type: u64, dir: in}
      - {name: page_threshold, type: u64, dir: in}

  - name: process_create
    number: 8
    arch: [x86_64]
    fuzz_only: false
    spec: [MIKSPEC-0008.R2]
    args:
      - {name: budget, type: Handle, dir: in, object: Budget, rights: [WRITE]}
      - {name: name, type: "*const u8", dir: in}
      - {name: name_len, type: u64, dir: in}
      - {name: out, type: "*mut Handle", dir: out}

  - name: thread_create
    number: 9
    arch: [x86_64]
    fuzz_only: false
    spec: [MIKSPEC-0008.R3]
    args:
      - {name: process, type: Handle, dir: in, object: Process, rights: [MANAGE]}
      - {name: name, type: "*const u8", dir: in}
      - {name: name_len, type: u64, dir: in}
      - {name: out, type: "*mut Handle", dir: out}

  - name: process_start
    number: 10
    arch: [x86_64]
    fuzz_only: false
    spec: [MIKSPEC-0008.R4]
    args:
      - {name: process, type: Handle, dir: in, object: Process, rights: [MANAGE]}
      - {name: thread, type: Handle, dir: in, object: Thread, rights: [MANAGE]}
      - {name: entry, type: u64, dir: in}
      - {name: stack, type: u64, dir: in}
      - {name: arg, type: Handle, dir: in, object: any, rights: [TRANSFER], allow_invalid: true}
      - {name: arg2, type: u64, dir: in}

  - name: thread_start
    number: 11
    arch: [x86_64]
    fuzz_only: false
    spec: [MIKSPEC-0008.R5]
    args:
      - {name: thread, type: Handle, dir: in, object: Thread, rights: [MANAGE]}
      - {name: entry, type: u64, dir: in}
      - {name: stack, type: u64, dir: in}
      - {name: arg1, type: u64, dir: in}
      - {name: arg2, type: u64, dir: in}

  - name: thread_set_user_base
    number: 12
    arch: [x86_64]
    fuzz_only: false
    spec: [MIKSPEC-0016.R15]
    args:
      - {name: which, type: u32, dir: in}
      - {name: value, type: u64, dir: in}

  - name: thread_exit
    number: 13
    arch: [x86_64]
    fuzz_only: false
    spec: [MIKSPEC-0008.R7]
    args: []

  - name: process_exit
    number: 14
    arch: [x86_64]
    fuzz_only: false
    spec: [MIKSPEC-0008.R7]
    args:
      - {name: code, type: i64, dir: in}

  - name: task_kill
    number: 15
    arch: [x86_64]
    fuzz_only: false
    spec: [MIKSPEC-0008.R8]
    args:
      - {name: handle, type: Handle, dir: in, object: [Process, Thread], rights: [MANAGE]}

  - name: mem_create
    number: 16
    arch: [x86_64]
    fuzz_only: false
    spec: [MIKSPEC-0006.R12]
    args:
      - {name: size, type: u64, dir: in}
      - {name: options, type: u32, dir: in}
      - {name: out, type: "*mut Handle", dir: out}

  - name: mem_read
    number: 17
    arch: [x86_64]
    fuzz_only: false
    spec: [MIKSPEC-0006.R13]
    args:
      - {name: mem, type: Handle, dir: in, object: MemoryObject, rights: [READ]}
      - {name: offset, type: u64, dir: in}
      - {name: buf, type: "*mut u8", dir: out}
      - {name: len, type: u64, dir: in}

  - name: mem_write
    number: 18
    arch: [x86_64]
    fuzz_only: false
    spec: [MIKSPEC-0006.R13]
    args:
      - {name: mem, type: Handle, dir: in, object: MemoryObject, rights: [WRITE]}
      - {name: offset, type: u64, dir: in}
      - {name: buf, type: "*const u8", dir: in}
      - {name: len, type: u64, dir: in}

  - name: mem_set_size
    number: 19
    arch: [x86_64]
    fuzz_only: false
    spec: [MIKSPEC-0006.R14]
    args:
      - {name: mem, type: Handle, dir: in, object: MemoryObject, rights: [WRITE]}
      - {name: size, type: u64, dir: in}

  - name: vm_map
    number: 20
    arch: [x86_64]
    fuzz_only: false
    spec: [MIKSPEC-0006.R17, MIKSPEC-0006.R18, MIKSPEC-0006.R26, MIKSPEC-0071.R6, MIKSPEC-0071.R9]
    args:
      - {name: process, type: Handle, dir: in, object: Process, rights: [MAP]}
      - {name: options, type: u32, dir: in}
      - {name: addr, type: u64, dir: in}
      - {name: mem, type: Handle, dir: in, object: MemoryObject, rights: [MAP]}
      - {name: offset, type: u64, dir: in}
      - {name: len, type: u64, dir: in}
      - {name: out_addr, type: "*mut u64", dir: out}

  - name: vm_unmap
    number: 21
    arch: [x86_64]
    fuzz_only: false
    spec: [MIKSPEC-0006.R19]
    args:
      - {name: process, type: Handle, dir: in, object: Process, rights: [MAP]}
      - {name: addr, type: u64, dir: in}
      - {name: len, type: u64, dir: in}
