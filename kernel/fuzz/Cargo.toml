[package]
name = "kernel-fuzz"
version = "0.0.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }
boot-protocol = { path = "../../boot/protocol" }
kernel-core = { path = "../core" }

[build-dependencies]
syscall-table = { path = "../syscalls" }

# The calls that exist only in the kernel's fuzz build, which the
# generated dispatch leaves out unless this is enabled.
[features]
fuzz = []
# The calls of the diagnostic build, which the harness never enables.
diag = []

# The targets run with debug assertions and overflow checks.
[profile.release]
debug = true
debug-assertions = true
overflow-checks = true

[workspace]
members = ["."]

[[bin]]
name = "bootinfo"
path = "fuzz_targets/bootinfo.rs"
test = false
doc = false
bench = false

