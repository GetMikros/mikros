[package]
name = "user-fuzz"
version = "0.0.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
midl-tests = { path = "../midl-tests" }

[build-dependencies]
midlc = { path = "../midlc" }

# The targets run with debug assertions and overflow checks.
[profile.release]
debug = true
debug-assertions = true
overflow-checks = true

[workspace]
members = ["."]

[[bin]]
name = "messages"
path = "fuzz_targets/messages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "grants"
path = "fuzz_targets/grants.rs"
test = false
doc = false
bench = false
