# The setup that the jobs of ci.yml share, after their host tools and
# checkout: Rust, cargo-fuzz and the firmware, and the caches of earlier
# runs. The job that saves the caches gives the same paths as here,
# since a cache is only found again under the paths it was saved with.
name: Set up the build
description: Restore the caches, install Rust and cargo-fuzz, and fetch the firmware.

outputs:
  rustup-key:
    description: The key of the Rust toolchain cache.
    value: ${{ steps.rustup.outputs.cache-primary-key }}
  rustup-hit:
    description: Whether the Rust toolchain cache had that exact key.
    value: ${{ steps.rustup.outputs.cache-hit }}
  cargo-home-key:
    description: The key of the cargo-fuzz and crate registry cache.
    value: ${{ steps.cargo-home.outputs.cache-primary-key }}
  cargo-home-hit:
    description: Whether the cargo-fuzz and crate registry cache had that exact key.
    value: ${{ steps.cargo-home.outputs.cache-hit }}
  llvm-key:
    description: The key of the LLVM build cache.
    value: ${{ steps.llvm.outputs.cache-primary-key }}
  llvm-hit:
    description: Whether the LLVM build cache had that exact key.
    value: ${{ steps.llvm.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # The toolchain that rust-toolchain.toml names, which rustup would
    # otherwise download at the first cargo command.
    - name: Restore the Rust toolchain
      id: rustup
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.rustup/toolchains
          ~/.rustup/update-hashes
        key: rustup-${{ hashFiles('rust-toolchain.toml') }}
    # cargo-fuzz is pinned, so that a cached copy is not built again from
    # source whenever a new release appears.
    - name: Restore cargo-fuzz and the crate registry
      id: cargo-home
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cargo/bin/cargo-fuzz
          ~/.cargo/.crates.toml
          ~/.cargo/.crates2.json
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: cargo-home-fuzz-0.13.2-${{ hashFiles('Cargo.lock', 'user/Cargo.lock', 'user/std/Cargo.lock', 'kernel/fuzz/Cargo.lock', 'boot/mikrosboot/fuzz/Cargo.lock') }}
        restore-keys: cargo-home-fuzz-0.13.2-
    # Building Clang and LLD takes about an hour, so the LLVM directory,
    # with its source and build tree, is kept between runs.
    - name: Restore the LLVM build
      id: llvm
      uses: actions/cache/restore@v4
      with:
        path: target/llvm
        key: llvm-${{ hashFiles('xtask/src/llvm.rs', 'tools/llvm/patches/**') }}
        restore-keys: llvm-
    - name: Install Rust
      shell: sh
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
          | sh -s -- -y --profile minimal --default-toolchain none
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: Install cargo-fuzz and fetch the firmware
      shell: sh
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        cargo install cargo-fuzz --version 0.13.2 --locked
        cargo xtask setup
