# Checks, builds and tests every change with the xtask commands only.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-24.04
    # Debian trixie has the btrfs-progs and QEMU versions the tools need.
    container: debian:trixie
    steps:
      - name: Install the host tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git \
            qemu-system-x86 gdb btrfs-progs \
            cmake ninja-build clang lld python3 zstd bison
      - uses: actions/checkout@v4
        with:
          # The commit checks look at every commit since the base branch.
          fetch-depth: 0
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install cargo-fuzz and fetch the firmware
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cargo install cargo-fuzz --locked
          cargo xtask setup
      # Building Clang and LLD takes about an hour, so the LLVM directory,
      # with its source and build tree, is kept between runs.
      - name: Restore the LLVM build
        id: llvm-cache
        uses: actions/cache/restore@v4
        with:
          path: target/llvm
          key: llvm-${{ hashFiles('xtask/src/llvm.rs', 'tools/llvm/patches/**') }}
          restore-keys: llvm-
      - name: Check
        run: cargo xtask check --base "origin/${{ github.base_ref || 'main' }}"
      - name: Build
        run: |
          for kind in production debug fuzz; do
            cargo xtask build --kind "$kind"
          done
      # The runner has no KVM, so QEMU emulates every instruction, and the
      # QEMU runs take longer than xtask's default limit of 120 s.
      - name: Test
        run: cargo xtask test --timeout 600
      # Saved even when the tests fail, but only once the build is whole:
      # the compiler-rt builtins are the last thing it installs.
      - name: Save the LLVM build
        if: >-
          always() && steps.llvm-cache.outputs.cache-hit != 'true' &&
          hashFiles('target/llvm/install/lib/clang/*/lib/x86_64-unknown-mikros/libclang_rt.builtins.a') != ''
        uses: actions/cache/save@v4
        with:
          path: target/llvm
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}
      # Some integration tests, such as the coverage test, exist only in
      # fuzz builds. The host tests ran in the step above.
      - name: Test the fuzz build
        run: cargo xtask test --kind fuzz --no-host --timeout 600
