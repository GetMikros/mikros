# Checks, builds and runs the host tests on every change, with the xtask
# commands only. The QEMU integration tests run locally before a commit,
# and on GitHub only when started by hand, in vm-tests.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Incremental compilation data is of no use to a fresh checkout, and
  # would only grow the caches.
  CARGO_INCREMENTAL: 0

jobs:
  ci:
    runs-on: ubuntu-24.04
    # A push to main publishes the sysroot as a release (MIKSPEC-0062.R11).
    permissions:
      contents: write
    # Debian trixie has the btrfs-progs and QEMU versions the tools need.
    container: debian:trixie
    steps:
      - name: Install the host tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git \
            qemu-system-x86 gdb btrfs-progs exfatprogs \
            cmake ninja-build clang lld python3 zstd bison \
            libexpat1-dev pkg-config python3-mako python3-packaging python3-yaml flex gh
      - uses: actions/checkout@v4
        with:
          # The commit checks look at every commit since the base branch.
          fetch-depth: 0
          # The token that can write contents is only given to the step that
          # publishes, not left in the checkout for the code that CI runs.
          persist-credentials: false
      - name: Set up the build
        id: setup
        uses: ./.github/actions/setup
      - name: Check
        run: cargo xtask check --ci --base "origin/${{ github.base_ref || 'main' }}"
      - name: Build
        id: build
        run: |
          for kind in production debug fuzz diag; do
            cargo xtask build --kind "$kind"
          done
      - name: Test
        run: cargo xtask test --host
      # For a commit of main that passed, the sysroot and the toolchain
      # that the build made are the release `sysroot-<commit>` with their
      # two archives and the SHA-256 of each, and `sysroot-latest` has the
      # same files for the newest commit (MIKSPEC-0062.R22). A release is
      # deleted only to make `sysroot-latest` again.
      # `cargo xtask build` makes only part of the sysroot; the command that
      # installs all of it, system libraries and CMake packages included, runs
      # before it is packed (MIKSPEC-0062.R13).
      - name: Build the whole sysroot
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cargo xtask sysroot
      - name: Publish the sysroot and the toolchain
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          commit=$(git rev-parse --short=12 HEAD)
          llvm=$(ls -d target/llvm/llvm-project-*.src | head -n 1 | sed 's/.*llvm-project-//; s/\.src$//')
          cmake=$(target/cmake/install/bin/cmake --version | head -n 1 | sed 's/.* //')
          meson_dir=$(ls -d target/meson/meson-*/ | head -n 1)
          meson_dir=${meson_dir%/}
          meson=${meson_dir##*/meson-}
          manifest() {
            printf 'commit: %s\nllvm: %s\ncmake: %s\nmeson: %s\n' "$GITHUB_SHA" "$llvm" "$cmake" "$meson"
          }
          stage=$(mktemp -d)
          trap 'rm -rf "$stage"' EXIT
          mkdir "$stage/out"
          # The sysroot, with its manifest at the root of the archive.
          mkdir "$stage/sysroot-files"
          cp -a target/sysroot "$stage/sysroot-files/sysroot"
          manifest > "$stage/sysroot-files/sysroot-manifest.yaml"
          # The toolchain as copies, without debug sections, so that the
          # cached builds that the next run restores stay as they are.
          mkdir -p "$stage/toolchain-files/llvm" "$stage/toolchain-files/cmake" "$stage/toolchain-files/meson"
          cp -a target/llvm/install "$stage/toolchain-files/llvm/install"
          cp -a target/cmake/install "$stage/toolchain-files/cmake/install"
          cp -a "$meson_dir" "$stage/toolchain-files/meson/"
          manifest > "$stage/toolchain-files/toolchain-manifest.yaml"
          find "$stage/toolchain-files" -type f \( -perm /111 -o -name '*.so*' \) |
            while read -r file; do
              if head -c 4 "$file" | grep -q 'ELF'; then
                strip --strip-debug "$file" 2> /dev/null || true
              fi
            done
          cd "$stage/out"
          sysroot="mikros-sysroot-$commit.tar.zst"
          toolchain="mikros-toolchain-$commit.tar.zst"
          tar --use-compress-program="zstd -19 -T0" -C "$stage/sysroot-files" -cf "$sysroot" .
          tar --use-compress-program="zstd -19 -T0" -C "$stage/toolchain-files" -cf "$toolchain" .
          sha256sum "$sysroot" > "$sysroot.sha256"
          sha256sum "$toolchain" > "$toolchain.sha256"
          files="$sysroot $sysroot.sha256 $toolchain $toolchain.sha256"
          if ! gh release view "sysroot-$commit" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "sysroot-$commit" $files --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease \
              --title "Mikros sysroot and toolchain $commit" \
              --notes "The sysroot and the toolchain of cargo xtask at commit $GITHUB_SHA."
          fi
          # `sysroot-latest` moves only to the commit that is the head of
          # main, so that a run that ends late does not set it back.
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            if gh release view sysroot-latest --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release delete sysroot-latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"
            fi
            gh release create sysroot-latest $files --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease \
              --title "Mikros sysroot and toolchain, newest" \
              --notes "The newest release is sysroot-$commit."
          fi
      # The caches are saved even when the tests fail, once the build
      # succeeded, under the keys and paths that the setup restored them
      # with. A cache whose exact key was found is not saved again.
      - name: Save the Rust toolchain
        if: >-
          always() && steps.build.outcome == 'success' &&
          steps.setup.outputs.rustup-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
          key: ${{ steps.setup.outputs.rustup-key }}
      - name: Save cargo-fuzz and the crate registry
        if: >-
          always() && steps.build.outcome == 'success' &&
          steps.setup.outputs.cargo-home-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/bin/cargo-fuzz
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.setup.outputs.cargo-home-key }}
      - name: Save the downloads and tool builds
        if: >-
          always() && steps.build.outcome == 'success' &&
          steps.setup.outputs.tools-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            target/firmware
            target/meson
            target/cmake
            target/musl
            target/glslang
            target/sources
          key: ${{ steps.setup.outputs.tools-key }}
      - name: Save the Rust builds
        if: >-
          always() && steps.build.outcome == 'success' &&
          steps.setup.outputs.rust-build-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            target/debug
            target/release
            target/fuzz
            target/x86_64-unknown-none
            target/x86_64-unknown-uefi
            target/rust-std
            user/target
            kernel/fuzz/target
            boot/mikrosboot/fuzz/target
          key: ${{ steps.setup.outputs.rust-build-key }}
      # The LLVM build is saved when Ninja compiled something in it, which
      # changes its dependency log, and only once it is whole: the
      # compiler-rt builtins are the last thing it installs.
      - name: Save the LLVM build
        if: >-
          always() &&
          hashFiles('target/llvm/install/lib/clang/*/lib/x86_64-unknown-mikros/libclang_rt.builtins.a') != '' &&
          hashFiles('target/llvm/build/.ninja_deps') != steps.setup.outputs.llvm-deps
        uses: actions/cache/save@v4
        with:
          path: target/llvm
          key: llvm-${{ hashFiles('xtask/src/llvm.rs', 'tools/llvm/patches/**') }}-${{ hashFiles('target/llvm/build/.ninja_deps') }}
      # The builds of LLVM and Mesa for Mikros likewise, once lavapipe is
      # installed, with the sysroot they were built against and the build
      # of the C++ runtimes.
      - name: Save the build of LLVM for Mikros
        if: >-
          always() &&
          hashFiles('target/ported/mesa/install/system/libraries/libvulkan_lvp.dlib') != '' &&
          hashFiles('target/ported/llvm/build/.ninja_deps', 'target/ported/mesa/build/.ninja_deps') != steps.setup.outputs.llvm-port-deps
        uses: actions/cache/save@v4
        with:
          path: |
            target/ported/llvm
            target/ported/llvm-runtimes
            target/ported/mesa
            target/sysroot
          key: llvm-port-${{ hashFiles('xtask/src/llvm_port.rs', 'xtask/src/mesa.rs', 'user/ports/llvm/**', 'user/ports/mesa/**') }}-${{ hashFiles('target/ported/llvm/build/.ninja_deps', 'target/ported/mesa/build/.ninja_deps') }}
