# Checks, builds and tests every change with the xtask commands only.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Incremental compilation data is of no use to a fresh checkout, and
  # would only grow the caches.
  CARGO_INCREMENTAL: 0

jobs:
  ci:
    runs-on: ubuntu-24.04
    # Debian trixie has the btrfs-progs and QEMU versions the tools need.
    # QEMU runs with KVM, which the runner passes into the container.
    container:
      image: debian:trixie
      options: --device /dev/kvm
    steps:
      - name: Install the host tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git \
            qemu-system-x86 gdb btrfs-progs \
            cmake ninja-build clang lld python3 zstd bison
      - uses: actions/checkout@v4
        with:
          # The commit checks look at every commit since the base branch.
          fetch-depth: 0
      - name: Set up the build
        id: setup
        uses: ./.github/actions/setup
      - name: Check
        run: cargo xtask check --base "origin/${{ github.base_ref || 'main' }}"
      - name: Build
        id: build
        run: |
          for kind in production debug fuzz; do
            cargo xtask build --kind "$kind"
          done
      - name: Test
        run: cargo xtask test
      # Some integration tests, such as the coverage test, exist only in
      # fuzz builds. The host tests ran in the step above.
      - name: Test the fuzz build
        run: cargo xtask test --kind fuzz --no-host
      # The caches are saved even when the tests fail, once the build
      # succeeded, under the keys and paths that the setup restored them
      # with. A cache whose exact key was found is not saved again.
      - name: Save the Rust toolchain
        if: >-
          always() && steps.build.outcome == 'success' &&
          steps.setup.outputs.rustup-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
          key: ${{ steps.setup.outputs.rustup-key }}
      - name: Save cargo-fuzz and the crate registry
        if: >-
          always() && steps.build.outcome == 'success' &&
          steps.setup.outputs.cargo-home-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/bin/cargo-fuzz
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.setup.outputs.cargo-home-key }}
      - name: Save the downloads and tool builds
        if: >-
          always() && steps.build.outcome == 'success' &&
          steps.setup.outputs.tools-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            target/firmware
            target/meson
            target/cmake
            target/musl
            target/sources
          key: ${{ steps.setup.outputs.tools-key }}
      - name: Save the Rust builds
        if: >-
          always() && steps.build.outcome == 'success' &&
          steps.setup.outputs.rust-build-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            target/debug
            target/release
            target/fuzz
            target/x86_64-unknown-none
            target/x86_64-unknown-uefi
            target/rust-std
            user/target
            user/std/target
            kernel/fuzz/target
            boot/mikrosboot/fuzz/target
          key: ${{ steps.setup.outputs.rust-build-key }}
      # The LLVM build is saved only once it is whole: the compiler-rt
      # builtins are the last thing it installs.
      - name: Save the LLVM build
        if: >-
          always() && steps.setup.outputs.llvm-hit != 'true' &&
          hashFiles('target/llvm/install/lib/clang/*/lib/x86_64-unknown-mikros/libclang_rt.builtins.a') != ''
        uses: actions/cache/save@v4
        with:
          path: target/llvm
          key: ${{ steps.setup.outputs.llvm-key }}

  # The integration tests once more, without KVM, after the job above
  # passed. QEMU then emulates every instruction, and threads run much
  # later than with KVM, which shows tests that depend on timing. It
  # builds from the caches the job above saved, and saves none itself.
  emulated:
    needs: ci
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: Install the host tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git \
            qemu-system-x86 gdb btrfs-progs \
            cmake ninja-build clang lld python3 zstd bison
      - uses: actions/checkout@v4
      - name: Set up the build
        uses: ./.github/actions/setup
      # Without KVM, the first integration run took about 150 s on the
      # runner, and the test suites of ported projects add some 5 minutes
      # to it, so the limit leaves room well above xtask's default of
      # 240 s. The host tests ran in the job above.
      - name: Test without KVM
        run: cargo xtask test --no-host --timeout 1200
