[package]
name = "xtask"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
syscall-table = { path = "../kernel/syscalls" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1.5.4"
fatfs = "0.3.6"
flate2 = "1"
libc = "0.2.191"
lzma-rs = "0.3.0"
sha2 = "0.11.1"
tar = "0.4.46"
ureq = "3.5.0"
uuid = { version = "1.29.0", features = ["v4"] }
addr2line = { version = "0.27.1", default-features = false, features = ["loader", "rustc-demangle", "std"] }
