[package]
name = "xtask"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
syscall-table = { path = "../kernel/syscalls" }
mikros-userdb = { path = "../user/lib/userdb" }
mikros-exfat = { path = "../user/lib/exfat" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1.5.4"
fatfs = "0.3.6"
flate2 = "1"
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "std"] }
libc = "0.2.191"
lzma-rs = "0.3.0"
sha2 = "0.11.1"
rsa = { version = "0.10.0", features = ["pkcs1v15"] }
getrandom = { version = "0.4.3", features = ["sys_rng"] }
pem-rfc7468 = { version = "1.0.0", features = ["alloc"] }
tar = "0.4.46"
ureq = "3.5.0"
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
uuid = { version = "1.29.0", features = ["v4"] }
addr2line = { version = "0.27.1", default-features = false, features = ["loader", "rustc-demangle", "std"] }
