[workspace]
resolver = "3"
members = ["boot/bootmenu", "boot/mikrosboot", "boot/protocol", "kernel/arch/x86_64", "kernel/core", "kernel/syscalls", "tools/midl-tests", "tools/midlc", "user/lib/ata", "user/lib/bootfs", "user/lib/btrfs", "user/lib/casefold", "user/lib/cmos", "user/lib/evdev", "user/lib/exfat", "user/lib/fat", "user/lib/gpt", "user/lib/logstore", "user/lib/manifest", "user/lib/memfs", "user/lib/nvme", "user/lib/pci", "user/lib/ps2", "user/lib/permissions", "user/lib/tz", "user/lib/userdb", "user/lib/ustar", "user/lib/yaml", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"

# The production kernel keeps debug information so that it can be split
# into a file named by the kernel's build ID.
[profile.release.package.kernel-x86_64]
debug = true

# The fuzz build kind: the dev profile, built apart from it because the
# kernel is instrumented for coverage.
[profile.fuzz]
inherits = "dev"

# Unoptimized, BLAKE2s's compression function takes 44 KiB of stack,
# more than a kernel thread has, and the timer interrupt reseeds the
# kernel's random number generator on the stack it interrupts.
[profile.dev.package.blake2]
opt-level = 3

# Unoptimized, one password hash takes many seconds.
[profile.dev.package.argon2]
opt-level = 3
