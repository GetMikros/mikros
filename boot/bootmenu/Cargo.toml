[package]
name = "bootmenu"
version.workspace = true
edition.workspace = true
publish = false

[target.'cfg(target_os = "uefi")'.dependencies]
uefi = { version = "0.41.0", features = ["alloc", "global_allocator", "panic_handler"] }
uefi-raw = "0.17.0"

[dependencies]
fontdue = { version = "0.9.5", default-features = false, features = ["hashbrown"] }
libm = "0.2.16"
